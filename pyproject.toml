[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "subvocal"
dynamic = ["version"]
description = "Hardware-agnostic middleware connecting sEMG silent-speech interfaces to LLM agents"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Pranav Kalkunte", email = "pranav.kalkunte@utexas.edu" }]
keywords = ["semg", "silent-speech", "subvocal", "bci", "llm", "agents", "mcp", "accessibility"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Human Machine Interfaces",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2.0",
    "numpy>=1.20",
    "platformdirs>=3.0",
    "pyyaml>=6.0",
]

[project.urls]
Homepage = "https://github.com/PranavKalkunte/subvocal"
Documentation = "https://github.com/PranavKalkunte/subvocal/tree/main/docs"
Changelog = "https://github.com/PranavKalkunte/subvocal/blob/main/CHANGELOG.md"

[project.optional-dependencies]
ml = [
    "scipy>=1.7",
    "scikit-learn>=1.0",
    "joblib>=1.1",
    "torch>=2.0",
]
hardware = [
    "scipy>=1.7",
    "h5py>=3.0",
    "pyserial>=3.5",
]
metrics = [
    "prometheus-client>=0.14.0",
    "psutil>=5.9",
]
tts = ["pyttsx3>=2.90"]
export = ["onnx>=1.14"]
all = ["subvocal[ml,hardware,tts,export,metrics]"]
dev = [
    "subvocal[all]",
    "pytest>=7",
    "pytest-cov>=4",
    "ruff>=0.4",
    "pyright>=1.1.350",
    "build>=1.0",
    "twine>=5.0",
    "markdown>=3.5",
    "types-pyyaml>=6.0",
    "types-psutil>=5.9",
]

[project.scripts]
subvocal-mcp = "subvocal.mcp.server:main"

[tool.hatch.version]
path = "src/subvocal/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/subvocal"]

[tool.hatch.build.targets.wheel.force-include]
"src/subvocal/py.typed" = "subvocal/py.typed"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"

[tool.ruff]
line-length = 120
src = ["src", "tests", "benchmarks", "tools"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# E501: long lines are tolerated in docstrings/log messages; E741: single-letter
# math variable names are conventional in the DSP/ML code.
# S (bandit) via ruff was evaluated (72 hits, mostly noisy S101/S311/S603 in
# DSP/sim code) — kept as manual review via pip-audit + code review, not CI gate.
# ANN (flake8-annotations) considered but not enabled due to noise in DSP/ML code.
ignore = ["E501", "E741"]

[tool.pyright]
include = ["src"]
pythonVersion = "3.10"
typeCheckingMode = "basic"
reportMissingImports = "warning"
reportOptionalMemberAccess = "warning"
reportGeneralTypeIssues = "warning"
reportOptionalCall = "warning"
reportAttributeAccessIssue = "warning"
reportCallIssue = "warning"
reportOperatorIssue = "warning"
reportUnknownVariableType = "warning"
reportUnknownMemberType = "warning"
reportUnknownParameterType = "warning"
reportArgumentType = "warning"
reportAssignmentType = "warning"
# basic mode keeps CI green while new research modules (SPD/MONA/SpeechNet)
# are iterated; bump to standard once handcrafted/adaptor/SPD are fully typed.

[tool.coverage.run]
source = ["subvocal"]
branch = true

[tool.coverage.report]
fail_under = 65
show_missing = true
