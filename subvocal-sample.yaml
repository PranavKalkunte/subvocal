# Subvocal Middleware SDK Default Configuration Template

# Hardware / sEMG sensor data acquisition configuration
hardware:
  sample_rate: 250         # Sampling frequency in Hz (default: 250 for Cyton, 1000 for Synthetic/Replay, 2000 for Delsys)
  num_channels: 4          # Number of channels/electrodes active (default: 4)
  port: null               # Serial port (e.g. '/dev/ttyUSB0' or 'COM3'). Leave null for simulated/TCP drivers
  simulated: true          # Set to true to use synthetic/replay simulation instead of physical hardware

# Digital Signal Processing (filtering and smoothing)
dsp:
  bandpass_low: 1.3        # Bandpass filter lower cutoff in Hz
  bandpass_high: 50.0      # Bandpass filter upper cutoff in Hz
  bandpass_order: 4        # Butterworth filter order
  notch_freq: 60.0         # notch filter center frequency to cut out US mains hum (use 50.0 for EU/Asia)
  notch_q: 30.0            # notch filter quality factor
  smooth_window: 3         # sample count sliding moving average window

# EMG phonetic classifier settings
classifier:
  type: "rf"               # Model classifier type ('rf' for random forest, 'svm', 'cnn', 'gru')
  model_path: null         # Path to trained model weights / serialized classifier state
  confidence_threshold: 0.75 # Minimum confidence score required to publish a classified CommandToken
  cooldown_ms: 900         # Silent cooldown window in milliseconds before accepting another token activation
  rf_n_estimators: 200     # Number of trees (Random Forest type only)

# LLM Intent Decoder configuration
provider:
  llm_provider: "mock"     # LLM provider to reconstruct intents ('mock', 'gemini')
  api_key: null            # API credential key. Set via env SUBVOCAL_PROVIDER__API_KEY for security
  model_name: null         # Model identity (e.g., 'gemini-1.5-flash' or 'claude-3-5-sonnet')
  temperature: 0.0         # Decoding temperature

# Security and Action execution policies
policy:
  dry_run: false           # If true, resolves semantic intents but bypasses executor dispatch
  raise_on_policy_violation: false # Raise PolicyViolationError if policy checks fail instead of silent tracing

# Prometheus and event telemetry setup
telemetry:
  enabled: false           # Start prometheus client metrics server
  trace_enabled: true      # set false to disable JSONL PII tracing (opt-out); traces rotate at 10 MB when enabled (env SUBVOCAL_TELEMETRY__TRACE_ENABLED)
  prometheus_port: 8000    # Default HTTP port to expose metrics (validated range, low-cardinality registry)
  flush_interval_seconds: 30.0 # Time interval in seconds to flush metrics to console/exporter

# Session runtime configuration
runtime:
  phrase_timeout_seconds: 1.5 # Timeout duration in seconds of token inactivity before processing intent
  session_liveness_timeout: 30.0 # Heartbeat watchdog expiration timeout for active streams
  trace_enabled: true      # same opt-out alias as telemetry.trace_enabled; false disables tracing (10 MB cap when enabled, env SUBVOCAL_RUNTIME__TRACE_ENABLED)

# Authentication Grants for external surfaces
auth:
  api_key: null            # API key to protect MCP and HTTP control interfaces

# ---------------------------------------------------------------------------
# Foundation / Adaptation — optional research frontier (requires subvocal[ml] + torch)
# Uncomment to enable; all modules are lazy-guarded and citation-documented.
# See README.md "Research Frontier (v2.1)" and src/subvocal/emg_core/*.
# ---------------------------------------------------------------------------
# foundation:
#   tinymyo:               # TinyMyo 3.6M Transformer + RoPE (foundation/tinymyo, arXiv:2512.15729)
#     num_channels: 4
#     patch_size: 10
#     embed_dim: 128
#     depth: 8
#     num_heads: 4
#     mask_ratio: 0.5
#   aemg:                  # AEMG NCT + VQ vocab (foundation/aemg_tokenizer, CVPR 2026)
#     codebook_size: 512
#     token_dim: 64
#     window_size: 32
#     stride: 16
#   spectre:               # SPECTRE STFT K-means + CyRoPE (foundation/spectre, 2512.22481)
#     num_channels: 16
#     embed_dim: 128
#     depth: 4
#     n_clusters: 64
#     nhead: 4
#
# adaptation:
#   sal_lbn:               # SAL/LBN 7-param spatial adaptation (adaptation/sal_lbn, 2409.08058)
#     num_channels: 8
#     use_affine: true     # 6-DoF 2×3 affine via affine_grid; false = per-channel only
#     use_translation_only: false  # 2-DoF (tx,ty) when true
#   cpep:                  # CPEP pose-EMG contrastive (adaptation/cpep, 2509.04699)
#     emg_channels: 8
#     pose_dim: 63
#     d_model: 256
#     embed_dim: 256
#     tau_init: 0.02
#   variance_transfer:     # Variance Transfer Bayesian GCM (adaptation/variance_transfer, EMBC 2024 / 2505.15381)
#     w_s: 1.0             # transfer strength (larger = less uncertainty, more transfer)
#     # m0: 0, beta0: 1, nu0: D+1, W0: I (fixed priors, see Yoneda et al.)
#
# datasets:                # Public dataset drivers (hardware/datasets)
#   # gaddy:               # Gaddy silent speech (Zenodo 4064409, 8×1000 Hz) — hardware/datasets GaddyDriver
#   #   data_dir: "./data/gaddy"
#   #   fs: 800.0
#   #   split: null        # silent | vocalized | null (all)
#   # meta:                # Meta sEMG-RD emg2pose (16×2000 Hz + pose) — hardware/datasets MetaEMGDriver
#   #   data_dir: "./data/meta"
#   #   fs: 2000.0
#   #   split: "train"     # train | val | test | all
#
# benchmarks:
#   emgbench:              # EMGBench 9-dataset LOSO (emg_core/benchmarks/emgbench, NeurIPS 2024 2410.23625)
#     root_dir: "./DatasetsProcessed_hdf5"
#     datasets: ["ninapro-db2","ninapro-db3","ninapro-db5","capgmyo-db-b","myoarmband","uciemg","mcs","hyser","flexwear-hd"]
#     mode: "loso"         # loso | adaptation
#     n_shot: 1
#
# # Notes:
# # - All foundation/adaptation/dataset/benchmark modules are optional under
# #   `pip install "subvocal[ml]"` (and `subvocal[hardware]` for HDF5) and do
# #   not handle raw PII beyond existing `telemetry.trace_enabled` opt-out
# #   (see SECURITY.md). Guarded imports raise MissingDependencyError with install hint.
# # - Keep YAML minimal; unknown keys are rejected (`extra="forbid"`).
