name: Release

on:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify tag matches package version
        run: |
          pip install --quiet hatchling
          PKG_VERSION=$(python -c "import re; s=open('src/subvocal/__init__.py').read(); print(re.search(r'__version__ = \"([^\"]+)\"', s).group(1))")
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "Tag $TAG_VERSION does not match subvocal.__version__ $PKG_VERSION" >&2
            exit 1
          fi

      - name: Build distributions
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          twine check dist/*

      - name: Smoke test wheel
        run: |
          python -m venv /tmp/rel-env
          /tmp/rel-env/bin/pip install --quiet dist/*.whl
          /tmp/rel-env/bin/python -c "from subvocal import SubvocalPipeline, __version__; print(__version__)"
          echo '{"jsonrpc":"2.0","id":1,"method":"initialize"}' | /tmp/rel-env/bin/subvocal-mcp | grep -q '"serverInfo"'

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish-pypi:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # PyPI trusted publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
