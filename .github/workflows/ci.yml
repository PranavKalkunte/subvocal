name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  PIP_EXTRA_INDEX_URL: https://download.pytorch.org/whl/cpu

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package with all extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[all,dev]"

      - name: Lint (ruff)
        run: ruff check src tests benchmarks tools

      - name: Type check (pyright)
        run: pyright

      - name: Run tests
        env:
          SUBVOCAL_DATA_DIR: ${{ runner.temp }}/subvocal-data
          SUBVOCAL_MODELS_DIR: ${{ runner.temp }}/subvocal-models
        run: pytest --cov=subvocal --cov-report=term-missing --cov-fail-under=75

      - name: Security audit (pip-audit)
        run: |
          pip install --quiet pip-audit || echo "pip-audit install failed (network?)"
          pip-audit --desc || echo "::warning::pip-audit found vulnerabilities or failed – review required"

      - name: License compliance audit
        run: python tools/check_licenses.py

  docs-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify generated site pages match sources
        run: |
          pip install --quiet markdown
          python tools/build_api_page.py
          python tools/build_site.py
          git diff --exit-code docs/ || {
            echo "::error::Generated docs are stale. Run tools/build_api_page.py and tools/build_site.py and commit." >&2
            exit 1
          }

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build distributions
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          twine check dist/*

      - name: Verify wheel contents
        run: |
          python - <<'EOF'
          import glob, zipfile
          wheel = glob.glob("dist/*.whl")[0]
          names = zipfile.ZipFile(wheel).namelist()
          assert any(n.endswith("subvocal/py.typed") for n in names), "py.typed missing from wheel"
          assert not any("tests/" in n or n.endswith((".pth", ".jsonl")) for n in names), "unexpected files in wheel"
          print(f"{wheel}: {len(names)} files OK")
          EOF

      - name: Install wheel in clean environment and smoke test
        run: |
          python -m venv /tmp/wheel-env
          /tmp/wheel-env/bin/pip install --quiet dist/*.whl
          /tmp/wheel-env/bin/python -c "from subvocal import SubvocalPipeline, __version__; print('import OK', __version__)"
          echo '{"jsonrpc":"2.0","id":1,"method":"initialize"}' | /tmp/wheel-env/bin/subvocal-mcp | grep -q '"serverInfo"'
          echo "subvocal-mcp handshake OK"

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
